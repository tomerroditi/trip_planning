# Cloudflare Worker — serves the MCP endpoint (/mcp, /sse), the read API
# (/api/*), and the static React app (everything else) from a single deploy.
#
# Deploys via Workers Builds (Git integration): on each push, Cloudflare runs
# `npm install` then `npx wrangler deploy`. The [build] step below builds the
# React app (app/dist is gitignored) before the Worker is bundled, so no
# dashboard build command is required.
name = "trip-planner"
main = "src/index.ts"
compatibility_date = "2026-06-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Build the static React app before deploying. Runs on `wrangler deploy`
# (including Workers Builds) and `wrangler dev`.
[build]
command = "npm run build:app"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# D1 — serverless SQLite. The shared source of truth between the MCP write
# path and the app's read path.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "trip-planner"
database_id = "635e3ccd-fd15-4f61-9834-d82bd1077b5a"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Static assets — the built React app (app/dist). The Worker runs first for
# the API/MCP routes; every other path is served from assets, falling back to
# index.html so client-side routing works.
# ---------------------------------------------------------------------------
[assets]
directory = "app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/mcp", "/mcp/*", "/sse", "/sse/*", "/api/*"]

# ---------------------------------------------------------------------------
# Durable Object backing the McpAgent. Uses SQLite-backed storage (free plan).
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "TripMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TripMcp"]

# ---------------------------------------------------------------------------
# The single trip rendered by v1 (the schema already supports many). The app
# and read API default to this id; override per request with ?trip=<id>.
# ---------------------------------------------------------------------------
[vars]
DEFAULT_TRIP_ID = "nz-south-island"
